<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Partner Portal | Lead Dashboard</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
  <style>
    .admin-header { background: var(--navy); color: var(--white); padding: 24px 0; }
    .admin-header-inner { display: flex; justify-content: space-between; align-items: center; }
    .admin-header h1 { font-size: 1.4rem; font-weight: 700; }
    .admin-header p { font-size: 0.85rem; opacity: 0.7; margin-top: 4px; }
    .stats-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin: 32px 0; }
    .stat-card { background: var(--white); border: 1px solid var(--gray-200); border-radius: 12px; padding: 24px; }
    .stat-card h4 { font-size: 0.8rem; text-transform: uppercase; letter-spacing: 1px; color: var(--gray-500); margin-bottom: 8px; }
    .stat-card .num { font-size: 2rem; font-weight: 800; color: var(--navy); }
    .filters { display: flex; gap: 12px; margin-bottom: 20px; flex-wrap: wrap; }
    .filters input, .filters select { width: auto; min-width: 200px; }
    .filters button { padding: 12px 20px; }
    .table-wrap { overflow-x: auto; background: var(--white); border: 1px solid var(--gray-200); border-radius: 12px; }
    .empty { padding: 60px; text-align: center; color: var(--gray-500); }
    .pagination { display: flex; gap: 8px; justify-content: center; margin-top: 24px; }
    .page-btn { padding: 8px 14px; border-radius: 8px; border: 1px solid var(--gray-200); background: var(--white); cursor: pointer; font-weight: 600; }
    .page-btn.active { background: var(--navy); color: var(--white); border-color: var(--navy); }
    .page-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .delete-btn { background: transparent; border: none; color: var(--danger); cursor: pointer; font-weight: 600; font-size: 0.85rem; }
    .delete-btn:hover { text-decoration: underline; }
    .refresh-btn { background: var(--gray-100); border: 1px solid var(--gray-200); color: var(--gray-700); padding: 8px 16px; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 0.85rem; }
    .refresh-btn:hover { background: var(--gray-200); }
    .type-chart { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 8px; }
    .type-item { display: flex; align-items: center; gap: 6px; font-size: 0.85rem; font-weight: 500; color: var(--gray-700); }
  </style>
</head>
<body>
  <div class="admin-header">
    <div class="container">
      <div class="admin-header-inner">
        <div>
          <h1>Partner Portal</h1>
          <p>Lead Management Dashboard — Advanced Marketing Co.</p>
        </div>
        <div style="display:flex;gap:12px;align-items:center;">
          <button class="refresh-btn" onclick="loadAll()">&#8635; Refresh</button>
          <a href="/" class="btn btn-primary" style="font-size:0.85rem;padding:10px 18px;">Back to Site</a>
        </div>
      </div>
    </div>
  </div>

  <div class="container" style="padding-top: 32px; padding-bottom: 60px;">
    <div class="stats-row">
      <div class="stat-card">
        <h4>Total Leads</h4>
        <div class="num" id="statTotal">—</div>
      </div>
      <div class="stat-card">
        <h4>Today's Leads</h4>
        <div class="num" id="statToday">—</div>
      </div>
      <div class="stat-card" style="grid-column: span 2;">
        <h4>By Product</h4>
        <div class="type-chart" id="statTypes">—</div>
      </div>
    </div>

    <div class="filters">
      <input type="text" id="searchInput" placeholder="Search name, business, email, phone..." onkeyup="if(event.key==='Enter')loadLeads()">
      <select id="typeFilter" onchange="loadLeads()">
        <option value="all">All Types</option>
        <option value="mca">Cash Advance</option>
        <option value="term-loan">Term Loan</option>
        <option value="sba">SBA Loan</option>
        <option value="equipment">Equipment</option>
        <option value="loc">Line of Credit</option>
        <option value="processing">Processing</option>
        <option value="invoice-factoring">Invoice Factoring</option>
        <option value="general">General</option>
      </select>
      <button class="btn btn-navy" onclick="loadLeads()">Search</button>
      <button class="btn btn-outline" onclick="document.getElementById('searchInput').value='';document.getElementById('typeFilter').value='all';loadLeads();">Clear</button>
    </div>

    <div class="table-wrap">
      <table class="admin-table" id="leadsTable">
        <thead>
          <tr>
            <th>ID</th>
            <th>Date</th>
            <th>Type</th>
            <th>Name</th>
            <th>Business</th>
            <th>Email</th>
            <th>Phone</th>
            <th>Revenue</th>
            <th>Time in Biz</th>
            <th>Amount</th>
            <th>Notes</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="leadsBody">
          <tr><td colspan="12" class="empty">Loading leads...</td></tr>
        </tbody>
      </table>
    </div>

    <div class="pagination" id="pagination"></div>
  </div>

  <script>
    let currentPage = 1;
    const perPage = 50;

    function formatDate(d) {
      if (!d) return '-';
      const date = new Date(d);
      return date.toLocaleDateString() + ' ' + date.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
    }

    function typeTag(type) {
      const map = {
        'mca': 'tag-mca',
        'term-loan': 'tag-term',
        'sba': 'tag-sba',
        'equipment': 'tag-equipment',
        'loc': 'tag-loc',
        'processing': 'tag-processing',
        'invoice-factoring': 'tag-invoice',
        'general': 'tag-term'
      };
      const labels = {
        'mca': 'MCA',
        'term-loan': 'Term Loan',
        'sba': 'SBA',
        'equipment': 'Equipment',
        'loc': 'LOC',
        'processing': 'Processing',
        'invoice-factoring': 'Invoice',
        'general': 'General'
      };
      return `<span class="tag ${map[type]||'tag-term'}">${labels[type]||type}</span>`;
    }

    async function loadStats() {
      try {
        const res = await fetch('/api/admin/stats');
        const data = await res.json();
        document.getElementById('statTotal').textContent = data.total || 0;
        document.getElementById('statToday').textContent = data.today || 0;
        const typesEl = document.getElementById('statTypes');
        if (data.by_type && data.by_type.length) {
          typesEl.innerHTML = data.by_type.map(t => `<div class="type-item">${typeTag(t.loan_type)} ${t.count}</div>`).join('');
        } else {
          typesEl.innerHTML = '<span style="color:var(--gray-500)">No data yet</span>';
        }
      } catch (e) {
        console.error('Stats error', e);
      }
    }

    async function loadLeads(page = 1) {
      currentPage = page;
      const search = document.getElementById('searchInput').value;
      const type = document.getElementById('typeFilter').value;
      const tbody = document.getElementById('leadsBody');
      tbody.innerHTML = '<tr><td colspan="12" class="empty">Loading...</td></tr>';

      try {
        const url = `/api/admin/leads?page=${page}&limit=${perPage}&search=${encodeURIComponent(search)}&loan_type=${encodeURIComponent(type)}`;
        const res = await fetch(url);
        if (res.status === 401) {
          tbody.innerHTML = '<tr><td colspan="12" class="empty">Session expired. Please refresh and log in again.</td></tr>';
          return;
        }
        const rows = await res.json();
        if (!Array.isArray(rows) || rows.length === 0) {
          tbody.innerHTML = '<tr><td colspan="12" class="empty">No leads found.</td></tr>';
          renderPagination(0);
          return;
        }
        tbody.innerHTML = rows.map(r => `
          <tr>
            <td>#${r.id}</td>
            <td>${formatDate(r.created_at)}</td>
            <td>${typeTag(r.loan_type)}</td>
            <td><strong>${r.first_name} ${r.last_name}</strong></td>
            <td>${r.business_name}</td>
            <td><a href="mailto:${r.email}">${r.email}</a></td>
            <td>${r.phone}</td>
            <td>${r.monthly_revenue}</td>
            <td>${r.time_in_business}</td>
            <td>${r.funding_amount || '-'}</td>
            <td style="max-width:200px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;" title="${(r.notes||'').replace(/"/g,'&quot;')}">${r.notes || '-'}</td>
            <td><button class="delete-btn" onclick="deleteLead(${r.id})">Delete</button></td>
          </tr>
        `).join('');
        renderPagination(rows.length === perPage ? page + 1 : page);
      } catch (e) {
        tbody.innerHTML = '<tr><td colspan="12" class="empty">Error loading leads. Check console.</td></tr>';
      }
    }

    function renderPagination(lastPage) {
      const el = document.getElementById('pagination');
      let html = '';
      if (currentPage > 1) {
        html += `<button class="page-btn" onclick="loadLeads(${currentPage - 1})">Prev</button>`;
      }
      html += `<button class="page-btn active">${currentPage}</button>`;
      if (lastPage > currentPage) {
        html += `<button class="page-btn" onclick="loadLeads(${currentPage + 1})">Next</button>`;
      }
      el.innerHTML = html;
    }

    async function deleteLead(id) {
      if (!confirm('Delete lead #' + id + '? This cannot be undone.')) return;
      try {
        const res = await fetch('/api/admin/leads/' + id, { method: 'DELETE' });
        const json = await res.json();
        if (json.success) {
          loadAll();
        } else {
          alert('Delete failed.');
        }
      } catch {
        alert('Delete failed.');
      }
    }

    function loadAll() {
      loadStats();
      loadLeads(currentPage);
    }

    loadAll();
    setInterval(loadStats, 30000);
  </script>
</body>
</html>
